<style>
/* Layout: fixed ink sidebar (nav + country index) beside a scrolling workspace; each view = header, filter chips, then cards or tables */
:root{

  --bg:#f3f6f8; --surface:#ffffff; --sunk:#eaf0f3; --fg:#14212b; --muted:#5a6a77; --line:#d8e1e7;
  --accent:#0b6e8a; --accent-ink:#ffffff; --accent-soft:#e0f0f5; --accent-line:#a9d3e0;
  --ok:#1d7a4c; --ok-soft:#e2f3ea; --warn:#946400; --warn-soft:#fbf0d6; --idle:#66727c; --idle-soft:#edf0f2; --hot:#b03a2e; --hot-soft:#fbe7e4;

:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.25;text-wrap:balance}

/* shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:24px;padding:24px 16px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none;padding:0 8px}
.brand-mark{width:40px;height:40px;border:1px solid var(--side-2);border-radius:8px;display:grid;place-items:center;background:var(--side-2)}
.brand b{display:block;font-family:var(--f-head);font-size:19px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--side-muted)}
.side h4{margin:0 0 6px;padding:0 10px;font-size:12px;font-weight:500;color:var(--side-muted);display:flex;justify-content:space-between;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:6px;color:var(--side-fg);text-decoration:none;font-size:15px}
.nav a:hover{background:var(--side-2)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 #4fb3cf}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:12px;background:var(--side-2);padding:0 7px;border-radius:4px;color:var(--side-fg)}
.cidx a{display:grid;grid-template-columns:30px 1fr auto;gap:6px;padding:6px 10px;border-radius:6px;color:var(--side-fg);text-decoration:none;font-size:14px}
.cidx a:hover{background:var(--side-2)}
.cidx a[aria-current="true"]{background:var(--side-active)}
.cidx code{font-family:var(--f-mono);font-size:12px;color:var(--side-muted);align-self:center}
.cidx span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--side-muted);align-self:center}
.side-foot{margin-top:auto;border-top:1px solid var(--side-2);padding:16px 10px 0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.side-foot a{color:var(--side-fg);text-decoration:none}
.side-foot a:hover{text-decoration:underline}
.side-foot p{margin:0;color:var(--side-muted);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer}
.crumb{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:500}
.search{margin-left:auto;position:relative;width:min(380px,45vw)}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px 8px 34px;font-size:14px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8}
.content{padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px;max-width:1200px;width:100%}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:34px;font-weight:700;margin-top:6px}

.window{font-family:var(--f-mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.window span{color:var(--muted);font-family:var(--f-body);font-size:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--accent-line)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{font-family:var(--f-mono);opacity:.7;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:150px;font-size:14px}
.filters .spacer{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-head);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.tint{background:var(--accent-soft);border-color:var(--accent-line)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:21px;font-weight:600}
.panel-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.go{color:var(--accent);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
.go:hover{text-decoration:underline}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}

.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.acc{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:inherit}
.acc:hover{border-color:var(--accent-line)}
.acc.has{border-color:var(--accent-line);box-shadow:inset 3px 0 0 var(--accent)}
.code{font-family:var(--f-mono);font-size:12px;width:40px;height:34px;display:grid;place-items:center;border-radius:6px;background:var(--sunk);color:var(--muted)}
.acc b{display:block;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc small{display:block;color:var(--muted);font-size:12.5px}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500;display:inline-block}
.p-update{background:var(--ok-soft);color:var(--ok)}
.p-none{background:var(--idle-soft);color:var(--idle)}
.p-before{background:var(--warn-soft);color:var(--warn)}
.p-hi{background:var(--hot-soft);color:var(--hot)}
.p-mid{background:var(--warn-soft);color:var(--warn)}
.p-lo{background:var(--idle-soft);color:var(--idle)}
.grade{font-family:var(--f-mono);font-size:12px;font-weight:500;padding:0 7px;border-radius:4px;border:1px solid currentColor;display:inline-block;line-height:20px}
.gA{color:var(--gA)}.gB{color:var(--gB)}.gC{color:var(--gC)}.gD{color:var(--gD)}

/* items */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--accent-line)}
.item.before{border-style:dashed}
.item .ic{width:44px;height:44px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.item .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.item .meta i{font-style:normal;width:1px;height:12px;background:var(--line)}
.item h3{font-size:18px;font-weight:600;margin:4px 0 6px}
.item p{margin:0;color:var(--muted);font-size:14.5px}
.item .foot{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);align-items:center}
.item .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.mini-ladder{display:flex;gap:2px}
.mini-ladder span{width:10px;height:6px;border-radius:1px;background:var(--line)}
.mini-ladder .done{background:var(--accent-line)}
.mini-ladder .now{background:var(--accent)}
.stage-label{font-size:12px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;font-weight:500;color:var(--muted);background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td b{font-weight:500}
td small{display:block;color:var(--muted);font-size:12.5px}
.row-link{cursor:pointer}
.row-link:hover td{background:var(--sunk)}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit}
.ccard:hover{border-color:var(--accent-line)}
.ccard h3{font-size:24px;font-weight:600}
.ccard .en{color:var(--muted);font-size:14px;margin-top:-6px}
.ccard p{margin:0;font-size:14.5px}
.ccard .bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}

.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:96px 14px minmax(0,1fr);gap:12px;padding-bottom:16px}
.tl:last-child{padding-bottom:0}
.tl .d{font-family:var(--f-mono);font-size:13px;color:var(--fg);text-align:right}
.tl .d small{display:block;color:var(--muted);font-family:var(--f-body)}
.tl .dot{position:relative}
.tl .dot::before{content:"";position:absolute;left:3px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tl .dot::after{content:"";position:absolute;left:6px;top:18px;bottom:-16px;width:2px;background:var(--line)}
.tl:last-child .dot::after{display:none}
.tl p{margin:0;font-size:14px}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--surface);color:var(--fg);box-shadow:0 24px 64px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(8,20,28,.55)}
.dlg{padding:26px 28px;display:flex;flex-direction:column;gap:18px}
.dlg-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dlg h2{font-size:23px;font-weight:600}
.close{background:var(--sunk);border:0;border-radius:6px;padding:6px 12px;cursor:pointer;flex:none}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 18px;margin:0}
.dates dt{font-size:12px;color:var(--muted)}
.dates dd{margin:0;font-family:var(--f-mono);font-size:13px}
.ladder{display:flex;gap:2px;overflow-x:auto}
.ladder span{flex:1 0 auto;min-width:54px;text-align:center;font-size:12px;padding:5px 6px;background:var(--idle-soft);color:var(--idle)}
.ladder span:first-child{border-radius:5px 0 0 5px}.ladder span:last-child{border-radius:0 5px 5px 0}
.ladder .done{background:var(--accent-soft);color:var(--accent)}
.ladder .now{background:var(--accent);color:var(--accent-ink);font-weight:700}
.ladder.na span{opacity:.45}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lbl.inf{color:var(--warn)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.split>div{min-width:0}
.dlg ul{margin:0;padding-left:18px}
.dlg li+li{margin-top:5px}
.opp{background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.verify li::marker{content:"? ";color:var(--warn);font-family:var(--f-mono)}
.srcs li{word-break:break-word;font-size:14px}
.kb{font-size:13px;color:var(--muted)}

.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

@media (max-width:980px){.cols{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;transform:translateX(-100%);transition:transform .2s ease;padding-top:max(24px,env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(8,20,28,.5)}
  .menu-btn{display:inline-flex}
  .topbar{top:env(safe-area-inset-top,0px)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .search{width:auto;flex:1}
  .crumb span,.crumb svg{display:none}
  .head h1{font-size:27px}
  .split{grid-template-columns:1fr}
  .item{grid-template-columns:minmax(0,1fr)}
  .item .ic{display:none}
  .item .right{flex-direction:row;align-items:center;justify-content:flex-start}
  .content,.topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dlg{padding:20px}
}
@media (prefers-reduced-motion: reduce){.side{transition:none}}
</style>

};
const VIEWS=[
 ["overview","本期总览","SOUTHEAST EUROPE / CHANGE TRACKER"],

 ["countries","国家视图","SEVEN MARKETS"],

 ["calendar","时间节点","DEADLINES & TRIGGERS"],
 ["archive","往期与方法","PERIODS · EXCLUSIONS · METHOD"]
];
const TOPIC_DEFAULT="all";
let D=null, KB=null;
const S={view:"overview",country:"all",account:"all",topic:"all",grade:"all",stage:"all",win:"all",period:"all",q:""};

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;

function readHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  for(const k of Object.keys(S)){ S[k]=p.get(k)||(k==="q"?"":k==="view"?"overview":"all"); }
  if(!VIEWS.some(v=>v[0]===S.view)) S.view="overview";
}
function writeHash(patch){
  Object.assign(S,patch);
  const p=new URLSearchParams();
  p.set("view",S.view);
  for(const k of ["country","account","topic","grade","stage","win","period"]) if(S[k]!=="all") p.set(k,S[k]);
  if(S.q) p.set("q",S.q);
  const h="#"+p.toString();
  if(location.hash!==h) location.hash=h; else render();
}
const link=patch=>{const n={...S,...patch};const p=new URLSearchParams();p.set("view",n.view);for(const k of ["country","account","topic","grade","stage","win","period"]) if(n[k]&&n[k]!=="all") p.set(k,n[k]);if(n.q) p.set("q",n.q);return "#"+p.toString();};

const period=()=>D.periods[0];
const cur=()=>D.items.filter(i=>i.period===period().id);
const acc=id=>D.accounts.find(a=>a.id===id);
const ctry=id=>D.countries.find(c=>c.id===id);
const kbCount=(key,val)=>KB?KB.insights.filter(r=>(r[key]||[]).includes(val)).length:null;
const kbLink=(key,val)=>`./knowledge/#view=overview&${key}=${encodeURIComponent(val)}`;
const STATUS={update:["有更新","p-update"],none:["无可核实更新","p-none"],before:["窗口前条目","p-before"]};
const PRI={"高":"p-hi","中":"p-mid","低":"p-lo"};
const prioRank={"高":0,"中":1,"低":2};

function filtered(){
  const q=S.q.trim().toLowerCase();
  return D.items.filter(it=>
    (S.country==="all"||it.countries.includes(S.country))&&
    (S.account==="all"||it.accounts.includes(S.account)||it.relatedAccounts.includes(S.account))&&
    (S.topic==="all"||it.topic===S.topic)&&
    (S.grade==="all"||it.grades.includes(S.grade))&&
    (S.stage==="all"||(S.stage==="na"?it.stage===null:String(it.stage)===S.stage))&&
    (S.win==="all"||it.window===S.win)&&
    (S.period==="all"||it.period===S.period)&&
    (!q||JSON.stringify([it.title,it.summary,it.entity,it.facts,it.inferences,it.sources,it.countries.map(c=>ctry(c).name),it.accounts.map(a=>acc(a).name)]).toLowerCase().includes(q))
  );
}

function nav(){
  const counts={changes:D.items.length,opportunities:cur().length,calendar:period().calendar.length};
  $("#nav").innerHTML=VIEWS.map(([id,name])=>`<a href="${link({view:id})}" ${S.view===id?'aria-current="page"':""}>${svg(id)}<span>${name}</span>${counts[id]?`<span class="count">${counts[id]}</span>`:""}</a>`).join("");
  $("#cidx").innerHTML=D.countries.map(c=>{const n=cur().filter(i=>i.countries.includes(c.id)).length;return `<a href="${link({view:"countries",country:c.id})}" ${S.view==="countries"&&S.country===c.id?'aria-current="true"':""}><code>${c.id}</code><span>${c.name}</span><span>${n||"–"}</span></a>`;}).join("");
}

function head(title,sub,extra=""){
  const v=VIEWS.find(x=>x[0]===S.view);
  return `<div class="head"><div><div class="eyebrow">${v[2]}</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>${extra}</div>`;
}
function windowBox(){const p=period();return `<div class="window"><span>本期覆盖窗口（${p.tz}）</span>${esc(p.from)} → ${esc(p.to)}</div>`;}
function countryChips(viewId){
  return `<div class="chips" role="group" aria-label="按国家筛选"><button class="chip" data-country="all" aria-pressed="${S.country==="all"}">全部国家</button>${D.countries.map(c=>`<button class="chip" data-country="${c.id}" aria-pressed="${S.country===c.id}">${c.name}<small>${cur().filter(i=>i.countries.includes(c.id)).length||""}</small></button>`).join("")}</div>`;
}
function ladderMini(st){if(st===null) return `<span class="stage-label">阶段不适用</span>`;return `<span class="mini-ladder" aria-hidden="true">${D.stages.map((s,k)=>`<span class="${k<st?"done":k===st?"now":""}"></span>`).join("")}</span><span class="stage-label">${D.stages[st]}</span>`;}
function itemCard(it){
  const cs=it.countries.map(c=>ctry(c).name).join(" / ");
  const as=it.accounts.length?it.accounts.map(a=>acc(a).name).join("、"):"其他市场主体";
  return `<button class="item${it.window==="before"?" before":""}" data-item="${it.id}">
    <span class="ic">${esc(it.label)}</span>
    <span style="min-width:0"><span class="meta"><span>${esc(cs)}</span><span>·</span><span>${esc(D.topics[it.topic])}</span><i></i><span>${esc(as)}</span>${it.window==="before"?'<span class="pill p-before">窗口前补收</span>':""}</span>
    <h3>${esc(it.title)}</h3><p>${esc(it.summary)}</p>
    <span class="foot"><span>${esc(it.sources[0].title.split(" — ").pop())}</span><span class="mono">${esc(it.dates["发表"]||"")}</span></span></span>
    <span class="right"><span>${it.grades.map(g=>`<span class="grade g${g}">${g}</span>`).join(" ")}</span><span style="display:flex;gap:6px;align-items:center">${ladderMini(it.stage)}</span></span>
  </button>`;
}

/* views */
function vOverview(){
  const p=period(), items=cur();
  const inWin=items.filter(i=>i.window==="in").length, before=items.length-inWin;
  const aCount=items.filter(i=>i.grades.includes("A")).length;
  const vCount=items.reduce((n,i)=>n+i.verify.length,0);
  const updated=Object.values(p.accountStatus).filter(s=>s==="update").length;
  const kpis=[[inWin,"窗口内新增条目"],[before,"窗口前补收"],[`${updated}/9`,"有更新的重点客户"],[aCount,"含 A 级证据的条目"],[vCount,"待核实点"]];
  const accCards=D.accounts.map(a=>{const st=p.accountStatus[a.id]||"none";const n=items.filter(i=>i.accounts.includes(a.id)).length;const k=kbCount("accounts",a.id);
    return `<a class="acc${st!=="none"?" has":""}" href="${link({view:"changes",account:a.id,country:"all"})}"><span class="code">${a.country}</span><span style="min-width:0"><b>${esc(a.name)}</b><small>${n?`本期 ${n} 条`:"本期 0 条"}${k!==null?` · 研究库 ${k} 条`:""}</small></span><span class="pill ${STATUS[st][1]}">${STATUS[st][0]}</span></a>`;}).join("");
  const top=[...items].sort((a,b)=>(a.window>b.window?-1:1)||prioRank[a.priority]-prioRank[b.priority]).map(itemCard).join("");

  <section class="panel tint"><div class="panel-head"><div><div class="eyebrow">YOUR NINE ACCOUNTS</div><h2>先看客户：本期谁有变化</h2><p>顺序沿用你的客户名单；点开进入该客户的本期条目。</p></div><a class="go" href="${link({view:"accounts"})}">客户详情 →</a></div><div class="acc-grid">${accCards}</div></section>
  <div class="cols"><section class="panel"><div class="panel-head"><h2>本期条目</h2><a class="go" href="${link({view:"changes"})}">筛选全部 →</a></div><div class="list">${top}</div></section>
  <section class="panel"><div class="panel-head"><h2>即将到来</h2><a class="go" href="${link({view:"calendar"})}">全部节点 →</a></div>${timeline(p.calendar)}<p class="note">${esc(p.note)}</p></section></div>`;
}
function vChanges(){
  const rows=filtered();
  const accOpts=D.accounts.map(a=>`<option value="${a.id}" ${S.account===a.id?"selected":""}>${esc(a.name)}</option>`).join("");
  const topicOpts=Object.entries(D.topics).filter(([k])=>D.items.some(i=>i.topic===k)).map(([k,v])=>`<option value="${k}" ${S.topic===k?"selected":""}>${v}</option>`).join("");
  const stageOpts=D.stages.map((s,k)=>`<option value="${k}" ${S.stage===String(k)?"selected":""}>${s}</option>`).join("")+`<option value="na" ${S.stage==="na"?"selected":""}>不适用</option>`;
  const gOpts=Object.entries(D.grades).map(([k,v])=>`<option value="${k}" ${S.grade===k?"selected":""}>${k} · ${v}</option>`).join("");
  return head("变更条目","每条含来源、三种日期、证据等级与项目阶段；点开看事实、推断与待核实点。")+countryChips()+
  `<div class="filters">
    <select data-f="topic" aria-label="主题"><option value="all">全部主题</option>${topicOpts}</select>

    <select data-f="win" aria-label="窗口"><option value="all">窗口内 + 补收</option><option value="in" ${S.win==="in"?"selected":""}>仅窗口内</option><option value="before" ${S.win==="before"?"selected":""}>仅窗口前补收</option></select>
    <span class="spacer"><span class="mono">${rows.length} 条</span><button class="linkbtn" id="reset">重置筛选</button></span></div>

  `<div class="tbl"><table><thead><tr><th>客户群</th><th>研究主体 / 边界</th><th>本期状态</th><th>本期条目</th><th>研究库记录</th></tr></thead><tbody>${rows||`<tr><td colspan="5">该国没有列入名单的重点客户。</td></tr>`}</tbody></table></div>

    return head(`${c.name} ${c.en}`,c.watch)+countryChips()+
    `<div class="kpis"><div class="kpi"><b>${its.length}</b><span>本期条目</span></div><div class="kpi"><b>${accs.length}</b><span>名单内客户</span></div><div class="kpi"><b>${k??"–"}</b><span>研究库记录</span></div></div>
    ${accs.length?`<section class="panel"><div class="panel-head"><h2>客户状态</h2></div><div class="acc-grid">${accs.map(a=>{const st=p.accountStatus[a.id]||"none";return `<a class="acc${st!=="none"?" has":""}" href="${link({view:"changes",account:a.id,country:"all"})}"><span class="code">${a.country}</span><span style="min-width:0"><b>${esc(a.name)}</b><small>${esc(a.scope)}</small></span><span class="pill ${STATUS[st][1]}">${STATUS[st][0]}</span></a>`;}).join("")}</div></section>`:""}
    <section class="panel"><div class="panel-head"><h2>本期条目</h2>${k!==null?`<a class="go" href="${kbLink("country",c.id)}">在研究库查看 ${c.name} →</a>`:""}</div><div class="list">${its.length?its.map(itemCard).join(""):`<div class="empty">本期无可核实更新。</div>`}</div></section>`;

function vOpps(){

  `<div class="tbl"><table><thead><tr><th>线索</th><th>优先级</th><th>阶段</th><th>触发事件</th><th>下一步</th><th>证据</th></tr></thead><tbody>${rows.map(it=>`<tr class="row-link" data-item="${it.id}"><td><b>${esc(it.title)}</b><small>${esc(it.opportunity)}</small></td><td><span class="pill ${PRI[it.priority]}">${it.priority}</span></td><td style="white-space:nowrap">${it.stage===null?"不适用":D.stages[it.stage]}</td><td>${esc(it.trigger)}</td><td>${esc(it.nextStep)}</td><td>${it.grades.map(g=>`<span class="grade g${g}">${g}</span>`).join(" ")}</td></tr>`).join("")||`<tr><td colspan="6">当前筛选下没有线索。</td></tr>`}</tbody></table></div>`;
}
function timeline(list){return `<div class="timeline">${[...list].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="tl"><div class="d">${esc(e.dateLabel||e.date.slice(5))}<small>${esc(e.dateLabel?"":e.date.slice(0,4))}</small></div><div class="dot"></div><p>${esc(e.event)} <span class="grade g${e.grade}">${e.grade}</span><br><small style="color:var(--muted)">${esc(acc(e.account)?.name||"")} · <a href="${esc(e.url)}" target="_blank" rel="noopener">来源</a></small></p></div>`).join("")}</div>`;}
function vCalendar(){
  return head("时间节点","投标截止、咨询期和预期签约等会改变机会窗口的日期。不计入本期新增。")+`<section class="panel">${timeline(period().calendar)}</section>`;

  $("#dlg-body").innerHTML=`<div class="dlg">
   <div class="dlg-top"><div><div class="eyebrow">${esc(it.label)} · ${it.countries.map(c=>ctry(c).name).join(" / ")} · ${esc(D.topics[it.topic])}</div><h2 id="dlg-title">${esc(it.title)}</h2></div><button class="close" id="close">关闭</button></div>

   <dl class="dates">${Object.entries(it.dates).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
   <div><div class="lbl">项目阶段</div>${ladder}<p class="kb" style="margin:6px 0 0">${esc(it.stageNote)}</p></div>

  </div>`;
  const d=$("#dlg"); if(d.showModal) d.showModal(); else d.setAttribute("open","");
  $("#close").onclick=()=>d.close();
}

function render(){
  nav();
  const v=VIEWS.find(x=>x[0]===S.view);
  $("#crumb").textContent=v[1];
  document.title=(S.view==="overview"?"":v[1]+" · ")+"SEE7 变更追踪";
  const q=$("#q"); if(document.activeElement!==q) q.value=S.q;
  const fn={overview:vOverview,changes:vChanges,accounts:vAccounts,countries:vCountries,opportunities:vOpps,calendar:vCalendar,archive:vArchive}[S.view];
  $("#view").innerHTML=fn()+`<footer>数据：<a href="./data/briefs.json">data/briefs.json</a> · 最近一期 ${period().id}（检索 ${period().retrieved}）· 由 Claude 维护。公开研究库见 <a href="./knowledge/">/knowledge/</a>。</footer>`;
  $("#side").classList.remove("open"); $("#menu").setAttribute("aria-expanded","false");
}

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-country]"); if(c){writeHash({country:c.dataset.country});return;}
  const it=e.target.closest("[data-item]"); if(it){detail(it.dataset.item);return;}
  const r=e.target.closest("tr[data-href]"); if(r&&!e.target.closest("a")){location.hash=r.dataset.href;return;}
  if(e.target.id==="reset"){writeHash({country:"all",account:"all",topic:"all",grade:"all",stage:"all",win:"all",period:"all",q:""});return;}
  if(e.target===$("#dlg")) $("#dlg").close();
});
document.addEventListener("change",e=>{const f=e.target.dataset.f; if(f) writeHash({[f]:e.target.value});});
let t; $("#q").addEventListener("input",e=>{clearTimeout(t);t=setTimeout(()=>{const v=e.target.value.trim();writeHash({q:v,view:v&&!["changes","opportunities"].includes(S.view)?"changes":S.view});},250);});
$("#menu").addEventListener("click",()=>{const s=$("#side");s.classList.toggle("open");$("#menu").setAttribute("aria-expanded",s.classList.contains("open"));});
window.addEventListener("hashchange",()=>{readHash();render();});

fetch("./data/briefs.json").then(r=>{if(!r.ok) throw new Error(r.status);return r.json();}).then(d=>{
  D=d; readHash(); render();
  fetch("./knowledge/data.json").then(r=>r.ok?r.json():null).then(k=>{if(k&&Array.isArray(k.insights)){KB=k;render();}}).catch(()=>{});
}).catch(err=>{$("#view").innerHTML=`<div class="empty">数据载入失败（${esc(err.message)}）。请稍后刷新，或直接查看 <a href="./data/briefs.json">data/briefs.json</a>。</div>`;});
})();
</script>
</body>
</html>
